name: Release

# Only tagged releases produce a signed APK. Every quality gate must pass first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and unit tests (scoring, math, deadlines, migrations, agent evals, UI)
        run: ./gradlew --no-daemon --stacktrace lintRelease testDebugUnitTest

  build:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Fallback signing key: until the four BALLOT_* secrets exist, the runner's debug key is
      # kept in the Actions cache so successive releases still install over each other.
      - name: Restore fallback signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ballot-fallback-keystore-v1
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.BALLOT_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::BALLOT_KEYSTORE_B64 secret not set; signing with the cached fallback key"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ballot.jks"
          echo "BALLOT_KEYSTORE_PATH=$RUNNER_TEMP/ballot.jks" >> "$GITHUB_ENV"
      - name: Version
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then NAME="0.0.${GITHUB_RUN_NUMBER}-manual"; fi
          echo "BALLOT_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BALLOT_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          BALLOT_KEYSTORE_PASSWORD: ${{ secrets.BALLOT_KEYSTORE_PASSWORD }}
          BALLOT_KEY_ALIAS: ${{ secrets.BALLOT_KEY_ALIAS }}
          BALLOT_KEY_PASSWORD: ${{ secrets.BALLOT_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Ballot-${BALLOT_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Ballot-*.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r Ballot-*.apk
            adb shell am start -W -n com.emotionalleaves.ballot/.MainActivity
            sleep 20
            adb shell pidof com.emotionalleaves.ballot
            adb logcat -d -s AndroidRuntime:E | tail -50

  publish:
    needs: smoke
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: Ballot-*.apk
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
