name: Release

# Only releases produce a signed APK. Every quality gate must pass first.
# A release starts when VERSION changes on main (the loop's version bump at the end of each cycle),
# when a v* tag is pushed, or by hand. The workflow creates the v<VERSION> tag itself.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and unit tests (scoring, math, deadlines, migrations, agent evals, UI)
        run: ./gradlew --no-daemon --stacktrace lintRelease testDebugUnitTest

  build:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        run: |
          NAME="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; fi
          echo "BALLOT_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          # The version code comes from VERSION itself (0.3.6 -> 30600), not from the CI run count, so it only ever
          # goes up with the version and never resets if the workflow is renamed. Android refuses a lower code.
          IFS=. read -r MA MI PA <<< "${NAME%%-*}"
          CODE=$(( ${MA:-0} * 1000000 + ${MI:-0} * 10000 + ${PA:-0} * 100 ))
          if [ "$CODE" -le 1100 ]; then echo "::error::Version code $CODE would not be above the old run-number codes"; exit 1; fi
          echo "BALLOT_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      # Signed with the fixed key in signing/ so each release installs over the last and keeps data.
      # The fingerprint check stops a release that would not install over the previous one.
      - name: Build signed release APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Ballot-${BALLOT_VERSION_NAME}.apk"
      - name: Check signing key is the pinned one
        run: |
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          GOT="$("$SIGNER" verify --print-certs "Ballot-${BALLOT_VERSION_NAME}.apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')"
          WANT="$(tr -d '[:space:]' < signing/FINGERPRINT)"
          echo "signer: $GOT"
          if [ "$GOT" != "$WANT" ]; then echo "::error::Release is signed with a different key ($GOT); it would not install over the last APK"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Ballot-*.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r Ballot-*.apk
            adb shell am start -W -n com.emotionalleaves.ballot/.MainActivity
            sleep 20
            adb shell pidof com.emotionalleaves.ballot
            adb logcat -d -s AndroidRuntime:E | tail -50

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Tag
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "TAG=v$V" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Ballot ${{ env.TAG }}
          files: Ballot-*.apk
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
